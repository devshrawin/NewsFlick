name: Check feeds

# Runs a single long-lived job that checks feeds, commits, and repeats
# every 45 minutes internally via a plain `sleep` loop -- for up to ~5h40m
# per job, then a coarse restart schedule below kicks off the next block.
#
# Why not just a `schedule:` trigger firing every 45 min? Tried that first
# (see git history) and checked the actual run history via the REST API:
# even a single *hourly* cron went 4+ hours with zero scheduled fires on
# this repo. `schedule:` is best-effort with no SLA and no catch-up for a
# dropped tick -- that's true at any frequency here, not just high ones.
# An external cron pinger calling workflow_dispatch (also tried) works but
# needs a third-party account and a PAT to babysit -- more moving parts
# than this needs.
#
# This sidesteps both: the actual 45-min cadence lives in a bash `sleep`
# inside one running job, which doesn't depend on GitHub's scheduler at
# all once started. The `schedule:` below only has to fire roughly every
# 6 hours to keep the chain going -- coarse, infrequent triggers are far
# less prone to the congestion/drop behavior that killed the frequent
# version, and even a several-hour delay here barely matters.
#
# Pages deploys via classic branch-based Pages (Settings -> Pages ->
# Source -> "Deploy from a branch" -> main / /docs), NOT the
# actions/deploy-pages step -- that step can't be called repeatedly from
# inside a loop, only once per job. Branch-based Pages only offers /(root)
# or /docs as the folder choice, hence /docs and not the original
# /reports name. Branch-based Pages auto-republishes on every push to
# docs/, so no deploy step is needed here at all.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write

concurrency:
  group: check-feeds
  # true, not false: the loop is stateless -- each iteration does a full
  # independent check+commit+push, so if the 6-hourly restart trigger
  # fires while a previous loop is still alive, cancelling it and
  # starting fresh loses at most one unfinished iteration and never
  # corrupts anything. false would instead queue the new run, and queued
  # runs can stack faster than 6h blocks drain.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Comfortably under GitHub's 6h hard cap on hosted-runner job duration,
    # leaving room for setup/checkout/final commit before that cap would
    # kill the job mid-loop.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Loop feed checks every 45 minutes
        run: |
          set -uo pipefail
          git config user.name  "feed-check-bot"
          git config user.email "actions@github.com"

          # 5h20m of looping -- leaves ~20min of the 350min job budget free
          # for this last iteration's own check+commit to finish cleanly
          # before the hosted-runner timeout would kill it mid-push.
          END=$(( $(date +%s) + 5*3600 + 20*60 ))
          while true; do
            # set -uo pipefail (no -e) means a failing check_feeds.py
            # falls through to the git-diff check below rather than
            # aborting the loop -- deliberate, one bad run (a transient
            # network blip, say) shouldn't kill a 5h20m loop over one
            # feed. But silent is wrong: surface it as a job annotation
            # so a real recurring failure doesn't go unnoticed forever.
            if ! python pipeline/check_feeds.py; then
              echo "::warning::check_feeds.py failed this iteration -- will retry after the sleep"
            fi

            git add docs/
            if git diff --staged --quiet; then
              echo "No change in report — nothing to commit."
            else
              git commit -m "feed check $(date -u '+%Y-%m-%d %H:%M')"
              # Push directly. Only if that's rejected do we rebase and
              # retry once. An unconditional 'git pull --rebase' here is
              # what silently swallowed the push in testing, leaving a
              # green job with no report delivered.
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying."
                git fetch origin "${GITHUB_REF_NAME}"
                git rebase "origin/${GITHUB_REF_NAME}"
                git push origin "HEAD:${GITHUB_REF_NAME}"
              fi
              echo "Report pushed."
            fi

            NOW=$(date +%s)
            if [ "$NOW" -ge "$END" ]; then
              echo "Loop budget spent for this job -- the next scheduled run picks up from here."
              break
            fi
            sleep 2700
          done

      - name: Summary
        if: always()
        run: |
          echo "### Feed check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/feed_check.md ]; then
            head -12 docs/feed_check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the loop step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
