name: Check feeds

# Triggered externally every 45 minutes by a free cron pinger (cron-job.org)
# calling the GitHub REST API's workflow_dispatch endpoint -- see README for
# the exact setup. No API keys are stored in this repo; the pinger holds its
# own PAT.
#
# GitHub's own `schedule:` trigger used to live here (three offset cron
# lines emulating a 45-min cadence). Dropped it after checking the actual
# run history via the REST API: schedule-triggered runs were arriving
# 15 min to 10+ hours apart instead of every 45 -- `schedule` is documented
# by GitHub as best-effort with no SLA, and gets worse the more frequently
# you ask for it, with no catch-up for a dropped tick. workflow_dispatch,
# by contrast, fired instantly on all 16 manual runs checked -- so an
# external, reliable clock calling that endpoint is the fix, not a
# different cron expression.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Budget: 32 feeds x (2 UA attempts x 12s TIMEOUT + 2s backoff + 1s
    # politeness) ~= 24 min worst case, so 25 could be killed mid-run on a
    # bad-network hour -- and a kill means no report and no deploy. Re-do this
    # arithmetic if you add feeds or raise TIMEOUT.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check feeds
        run: python pipeline/check_feeds.py

      # Commit BEFORE deploying. The other order meant a failed push (protected
      # branch, or a rebase conflict on reports/) still shipped to Pages, so
      # the served page permanently disagreed with the committed one and the
      # job went red with no way to tell which copy was live.
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name  "feed-check-bot"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No change in report — nothing to commit."
            exit 0
          fi
          git commit -m "feed check $(date -u '+%Y-%m-%d %H:%M')"
          # Push directly. Only if that's rejected do we rebase and retry once.
          # An unconditional 'git pull --rebase' here is what silently swallowed
          # the push in testing, leaving a green job with no report delivered.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Report pushed."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        if: always()
        run: |
          echo "### Feed check" >> "$GITHUB_STEP_SUMMARY"
          echo "Articles page: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/feed_check.md ]; then
            head -12 reports/feed_check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the 'Check feeds' step log." >> "$GITHUB_STEP_SUMMARY"
          fi
