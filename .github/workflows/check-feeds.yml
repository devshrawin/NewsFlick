name: Check feeds

# Runs a single long-lived job that checks feeds, commits, and repeats
# every 45 minutes internally via a plain `sleep` loop -- for up to ~5h40m
# per job, then a coarse restart schedule below kicks off the next block.
#
# Why not just a `schedule:` trigger firing every 45 min? Tried that first
# (see git history) and checked the actual run history via the REST API:
# even a single *hourly* cron went 4+ hours with zero scheduled fires on
# this repo. `schedule:` is best-effort with no SLA and no catch-up for a
# dropped tick -- that's true at any frequency here, not just high ones.
# An external cron pinger calling workflow_dispatch (also tried) works but
# needs a third-party account and a PAT to babysit -- more moving parts
# than this needs.
#
# This sidesteps both: the actual 45-min cadence lives in a bash `sleep`
# inside one running job, which doesn't depend on GitHub's scheduler at
# all once started. The `schedule:` below only has to fire roughly every
# 6 hours to keep the chain going -- coarse, infrequent triggers are far
# less prone to the congestion/drop behavior that killed the frequent
# version, and even a several-hour delay here barely matters.
#
# Pages deploys via classic branch-based Pages (Settings -> Pages ->
# Source -> "Deploy from a branch" -> main / /docs), NOT the
# actions/deploy-pages step -- that step can't be called repeatedly from
# inside a loop, only once per job. Branch-based Pages only offers /(root)
# or /docs as the folder choice, hence /docs and not the original
# /reports name. Branch-based Pages auto-republishes on every push to
# docs/, so no deploy step is needed here at all.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: write

concurrency:
  group: check-feeds
  # true, not false: the loop is stateless -- each iteration does a full
  # independent check+commit+push, so if the 6-hourly restart trigger
  # fires while a previous loop is still alive, cancelling it and
  # starting fresh loses at most one unfinished iteration and never
  # corrupts anything. false would instead queue the new run, and queued
  # runs can stack faster than 6h blocks drain.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Comfortably under GitHub's 6h hard cap on hosted-runner job duration,
    # leaving room for setup/checkout/final commit before that cap would
    # kill the job mid-loop.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Loop feed checks every 45 minutes
        run: |
          set -uo pipefail
          git config user.name  "feed-check-bot"
          git config user.email "actions@github.com"

          BRANCH="${GITHUB_REF_NAME}"
          INTERVAL=2700          # target cadence between iteration *starts*
          # Reserve enough runway that an iteration never starts unless it can
          # plausibly finish. Worst case measured/derived: 78 feeds x (2 x
          # TIMEOUT=12s + 2s backoff + 1s politeness) ~= 35min, + up to 40
          # extractions x EXTRACT_TIMEOUT=10s ~= 7min, + dedupe/render ~1-2min.
          # `timeout` below caps a single run hard, so RESERVE only has to
          # cover that cap plus the commit/push.
          RESERVE=$(( 22 * 60 ))
          RUN_CAP=20m            # hard ceiling on one check_feeds.py run

          # 5h20m of looping -- leaves ~20min of the 350min job budget free
          # for the last iteration's own check+commit to finish cleanly
          # before the hosted-runner timeout would kill it mid-push.
          END=$(( $(date +%s) + 5*3600 + 20*60 ))

          while true; do
            ITER_START=$(date +%s)

            # set -uo pipefail (no -e) means a failing check_feeds.py falls
            # through to the commit logic below rather than aborting the loop
            # -- deliberate, one bad run (a transient network blip, say)
            # shouldn't kill a 5h20m loop. But silent is wrong: surface it as
            # a job annotation. `timeout` bounds the run so one pathological
            # iteration can't eat the whole job budget; both requests
            # timeouts inside the script are per-socket-op, not total, so a
            # slow-drip server can otherwise stall well past them.
            run_ok=1
            if ! timeout "${RUN_CAP}" python pipeline/check_feeds.py; then
              run_ok=0
              echo "::warning::check_feeds.py failed or exceeded ${RUN_CAP} this iteration -- will retry next iteration"
            fi

            # Only publish output from a run that actually completed. A run
            # killed by `timeout` can leave docs/ half-regenerated, and
            # committing that would publish a truncated deck.
            if [ "$run_ok" -eq 1 ]; then
              git add docs/ data/
              if git diff --staged --quiet; then
                echo "No change in report — nothing to commit."
              elif ! git commit -m "feed check $(date -u '+%Y-%m-%d %H:%M')"; then
                # Previously unchecked. A failed commit fell straight into the
                # push, which then exited 0 ("Everything up-to-date") because
                # HEAD already matched origin -- reporting success having
                # delivered nothing.
                echo "::warning::git commit failed -- nothing delivered this iteration"
              else
                # docs/ and data/ are GENERATED, wholly rewritten every run.
                # There is no meaningful merge for them, so don't rebase: on
                # rejection, stash the generated tree, hard-reset onto origin,
                # restore it, and re-commit. The generated output always wins
                # by construction, which makes conflicts on data/articles.jsonl
                # (a 1.1MB file re-sorted in full every run -- it conflicted
                # twice on 2026-08-13) structurally impossible rather than
                # something to recover from. The old rebase path could also
                # leave a mid-rebase tree that broke every later iteration's
                # commit for the rest of the job.
                pushed=0
                for attempt in 1 2 3; do
                  if git push origin "HEAD:${BRANCH}"; then
                    pushed=1
                    break
                  fi
                  echo "Push rejected (attempt ${attempt}/3) — replaying generated output onto origin/${BRANCH}."
                  TMP="$(mktemp -d)"
                  cp -r docs "$TMP/docs" && cp -r data "$TMP/data" || {
                    echo "::warning::could not stage generated output for replay"; break; }
                  if ! git fetch origin "${BRANCH}"; then
                    echo "::warning::fetch failed -- keeping local commit, will retry next iteration"
                    rm -rf "$TMP"; break
                  fi
                  if ! git reset --hard "origin/${BRANCH}"; then
                    # Previously unchecked, and the log claimed a reset had
                    # happened either way -- actively misleading mid-incident.
                    echo "::warning::reset to origin/${BRANCH} failed -- leaving tree as-is for the next iteration"
                    rm -rf "$TMP"; break
                  fi
                  rm -rf docs data
                  cp -r "$TMP/docs" docs && cp -r "$TMP/data" data
                  rm -rf "$TMP"
                  git add docs/ data/
                  if git diff --staged --quiet; then
                    echo "Origin already matches this iteration's output — nothing to re-commit."
                    pushed=1
                    break
                  fi
                  git commit -m "feed check $(date -u '+%Y-%m-%d %H:%M')" || {
                    echo "::warning::re-commit after replay failed"; break; }
                done

                # Trust the refs, not the exit code: verify what's on origin
                # actually matches what we built.
                git fetch origin "${BRANCH}" >/dev/null 2>&1 || true
                if [ "$pushed" -eq 1 ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${BRANCH}")" ]; then
                  echo "Report pushed and verified on origin/${BRANCH}."
                else
                  echo "::warning::this iteration's report was not delivered -- next iteration regenerates it"
                fi
              fi
            fi

            # Cadence is measured from iteration START, so work time doesn't
            # stack on top of the sleep. The old fixed `sleep 2700` after the
            # work made the real interval work+45min -- measured 47m18s before
            # extraction existed, and heading past 54min with it.
            NOW=$(date +%s)
            ELAPSED=$(( NOW - ITER_START ))
            SLEEP=$(( INTERVAL - ELAPSED ))
            [ "$SLEEP" -lt 60 ] && SLEEP=60

            # Check the budget against when the NEXT iteration would finish,
            # not just when it would start. The old check allowed an iteration
            # to begin at END-1s, which could then run past timeout-minutes
            # and be killed mid-push.
            if [ $(( NOW + SLEEP + RESERVE )) -ge "$END" ]; then
              echo "Not enough budget left for another full iteration -- the next scheduled run picks up from here."
              break
            fi
            echo "Sleeping ${SLEEP}s (iteration took ${ELAPSED}s)."
            sleep "$SLEEP"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Feed check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/feed_check.md ]; then
            head -12 docs/feed_check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the loop step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
