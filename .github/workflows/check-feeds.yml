name: Check feeds

# Runs hourly, or tap Actions -> Check feeds -> Run workflow for an
# on-demand run. No API keys needed.
#
# GitHub disables `schedule` triggers after 60 days with no repo activity
# (any push/commit resets the clock) -- re-enable from the Actions tab if
# that happens.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check feeds
        run: python pipeline/check_feeds.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name  "feed-check-bot"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No change in report — nothing to commit."
            exit 0
          fi
          git commit -m "feed check $(date -u '+%Y-%m-%d %H:%M')"
          # Push directly. Only if that's rejected do we rebase and retry once.
          # An unconditional 'git pull --rebase' here is what silently swallowed
          # the push in testing, leaving a green job with no report delivered.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Report pushed."

      - name: Summary
        if: always()
        run: |
          echo "### Feed check" >> "$GITHUB_STEP_SUMMARY"
          echo "Articles page: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/feed_check.md ]; then
            head -12 reports/feed_check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the 'Check feeds' step log." >> "$GITHUB_STEP_SUMMARY"
          fi
