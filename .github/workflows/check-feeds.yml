name: Check feeds

# Runs every 45 minutes, all day (32 runs/day), or tap Actions -> Check feeds
# -> Run workflow for an on-demand run. No API keys needed.
#
# Cron can't express a flat "every 45 minutes" in one line -- 45 doesn't
# divide 60, so a naive "*/45 * * * *" only ever fires at :00 and :45 (a
# 45/15 min alternating gap, not even spacing) and still hits :00 every hour.
# Since lcm(45, 60) = 180, the true pattern repeats every 3 hours at
# offsets +0/+45/+90/+135 min. Picking a start minute of :13 (instead of :00)
# keeps every run off the most congested cron slot on GitHub -- verified
# hourly "0 * * * *" bit us: 4+ hours and 8 runs passed with zero
# schedule-triggered runs (all manual) before that fix. These three lines
# together produce exactly :13, :58, :43, :28 cycling every 3 hours --
# verified programmatically: 32 runs/day, every gap exactly 45 min including
# the midnight wrap, none on :00.
#
# GitHub disables `schedule` triggers after 60 days with no repo activity
# (any push/commit resets the clock) -- re-enable from the Actions tab if
# that happens.
on:
  workflow_dispatch:
  schedule:
    - cron: "13,58 0-23/3 * * *"
    - cron: "43 1-23/3 * * *"
    - cron: "28 2-23/3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check-feeds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Budget: 32 feeds x (2 UA attempts x 12s TIMEOUT + 2s backoff + 1s
    # politeness) ~= 24 min worst case, so 25 could be killed mid-run on a
    # bad-network hour -- and a kill means no report and no deploy. Re-do this
    # arithmetic if you add feeds or raise TIMEOUT.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check feeds
        run: python pipeline/check_feeds.py

      # Commit BEFORE deploying. The other order meant a failed push (protected
      # branch, or a rebase conflict on reports/) still shipped to Pages, so
      # the served page permanently disagreed with the committed one and the
      # job went red with no way to tell which copy was live.
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name  "feed-check-bot"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No change in report — nothing to commit."
            exit 0
          fi
          git commit -m "feed check $(date -u '+%Y-%m-%d %H:%M')"
          # Push directly. Only if that's rejected do we rebase and retry once.
          # An unconditional 'git pull --rebase' here is what silently swallowed
          # the push in testing, leaving a green job with no report delivered.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejected — rebasing onto origin/${GITHUB_REF_NAME} and retrying."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Report pushed."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        if: always()
        run: |
          echo "### Feed check" >> "$GITHUB_STEP_SUMMARY"
          echo "Articles page: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/feed_check.md ]; then
            head -12 reports/feed_check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the 'Check feeds' step log." >> "$GITHUB_STEP_SUMMARY"
          fi
