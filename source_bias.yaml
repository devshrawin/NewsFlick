# Per-source metadata shown on cards. Despite the filename (kept so existing
# tooling/links don't break) this now carries three independent things:
#
#   leaning: Left | Lean Left | Center | Lean Right | Right   -- a JUDGMENT
#   country: where the publication is primarily based/edited  -- a FACT
#   funding: how it's funded/owned                            -- a FACT
#
# The split matters. `leaning` is a contestable claim about a real news
# organization's politics, so it is only ever set where a public rating can
# be cited (cite_name/cite_url), and stays absent otherwise -- an unrated
# source must never render as a "Center" judgment. `country` and `funding`
# are verifiable facts, so they can be filled in far more widely without
# asserting anything arguable.
#
# Why this file is hand-written and not generated: automating it was tried
# and measured, and it does not work.
#   - Political leaning: Wikidata (the only free, CC0, automatable option)
#     resolved only 5 of 15 real feed names to a unique news-organization
#     entity -- 6 were ambiguous, 4 had no match -- and 0 of the 5 that did
#     resolve carried a P1387 political-alignment value. A spot check with
#     hardcoded QIDs resolved 3 of 5 to a *plant species* and a *biography
#     database*, which is the real hazard: a bad match doesn't produce a
#     blank, it produces a confident political claim about the wrong
#     organization. AllSides/Ad Fontes/MBFC have no free API and near-zero
#     Indian coverage, which is exactly where the gap is.
#   - Country: 59 of 78 feeds are on .com/.org/.net, and several route via
#     feedburner.com / go.com aggregators, so the feed domain often isn't
#     the publisher's at all. TLD-based derivation is useless here.
#
# So: filled in by hand, once, from public fact. Where a value is genuinely
# uncertain (an outlet whose editorial base I can't state confidently) the
# key is LEFT OUT rather than guessed, and the card simply omits that tag --
# the same honest-gap rule `leaning` already follows. Don't backfill these
# with plausible-looking guesses; a blank is correct and a wrong fact isn't.
#
# funding values in use:
#   Private              -- commercial/privately owned (the default case)
#   Public broadcaster   -- publicly funded, editorially independent charter
#   State-funded         -- funded by a national government
#   Government           -- an actual government publication
#   Intergovernmental    -- a multi-state body (WHO)

sources:
  # ---- rated leaning (public citation available) ----
  BBC World:
    leaning: Center
    cite_name: AllSides
    cite_url: https://www.allsides.com/news-source/bbc-news-media-bias
    country: United Kingdom
    funding: Public broadcaster
  BBC Asia:
