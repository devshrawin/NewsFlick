# India news feeds for the 2-week clustering test.
# Chosen for MAXIMUM OVERLAP, not coverage. The same PTI story arriving
# ten times is the point — that's what the clustering is being tested on.
#
# These URLs are best-effort. Run the feed-check workflow to find out
# which are actually alive; delete or fix the dead ones.
#
# Last validated 2026-08-03 against every URL below (via pipeline/check_feeds.py's
# own fetch logic, not just a HEAD request). Verdicts move fast in this list --
# re-validate before trusting "OK" for more than a few weeks.
#   DEAD, not re-added: Firstpost, ThePrint, Scroll, The Wire (0 entries --
#     feed URL moved), Deccan Herald (404), Telegraph India / The Tribune /
#     Business Standard (403 -- blocking non-browser UA even with the
#     browser-UA retry), Outlook India / The Statesman / National Herald /
#     The New Indian Express / Sentinel Assam / Assam Tribune / Mid-day
#     (404), Financial Express (410 gone), CNBC TV18 (400), BW Businessworld
#     (0 entries), Fortune India / Digit / StartupNews (404), Film Companion
#     (0 entries), Down To Earth / ISRO (404), PIB / BOOM Live (0 entries),
#     Reuters World / Reuters India (feeds.reuters.com no longer resolves --
#     Reuters discontinued public RSS years ago), Associated Press (404, same
#     story -- apnews.com/rss isn't a real feed).

