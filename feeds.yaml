# India news feeds for the 2-week clustering test.
# Chosen for MAXIMUM OVERLAP, not coverage. The same PTI story arriving
# ten times is the point — that's what the clustering is being tested on.
# Expanded with a batch of major international outlets for broader
# world-news coverage alongside the India-domestic core.
#
# These URLs are best-effort. Run the feed-check workflow to find out
# which are actually alive; delete or fix the dead ones.
#
# Last validated 2026-08-10, full list including the international batch
# (via pipeline/check_feeds.py's own fetch logic, not just a HEAD request).
# 63/73 graded OK. Verdicts move fast -- re-validate before trusting "OK"
# for more than a few weeks.
#   DEAD, not re-added: Firstpost, ThePrint, Scroll, The Wire (0 entries --
#     feed URL moved), Deccan Herald (404), Telegraph India / The Tribune /
#     Business Standard (403 -- blocking non-browser UA even with the
#     browser-UA retry), Outlook India / The Statesman / National Herald /
#     The New Indian Express / Sentinel Assam / Assam Tribune / Mid-day
#     (404), Financial Express (410 gone), CNBC TV18 (400), BW Businessworld
#     (0 entries), Fortune India / Digit / StartupNews (404), Film Companion
#     (0 entries), Down To Earth / ISRO (404), PIB / BOOM Live (0 entries),
#     Reuters World / Reuters India (feeds.reuters.com no longer resolves --
#     Reuters discontinued public RSS years ago), Associated Press (404, same
#     story -- apnews.com/rss isn't a real feed), PolitiFact (404), Politico
#     (403), CNN World / CNN Top Stories / Wall Street Journal World (still
#     200 OK but stuck serving 1.5-2.9-year-old cached content -- frozen,
#     not just low-frequency like the STALE-flagged ones below).
#
# `region:` is a per-feed default fed to classify_region() -- most of these
# outlets are India-domestic, so an article that doesn't keyword-match any
# specific region (common on a short teaser body) should default to India
# rather than the meaningless "Other" bucket. Keyword detection still runs
# first and wins when a story is clearly about somewhere else -- this only
# fills in the article that matches nothing. Left unset on the genuinely
# international outlets, where there's no sensible single default.
#
# A round of alternate URLs was proposed for several already-working
# domestic feeds (different section paths on the same sites). Left the
# working URLs alone rather than swapping to unvalidated alternates for
# feeds that already work -- Indian Express is the one exception, since
# its current URL is the one known to 403 specifically from GitHub
# Actions' datacenter IPs; its alternate is worth trying since the
# current one is already broken from CI some of the time.
#
# 2026-08-13 audit: Indian Express and Medianama both 403'd from the CI
# run that day. Confirmed from a non-CI IP (this dev environment) that
# both return 200 with identical URLs -- this is GitHub Actions' IP range
# getting blocked, not a broken feed or a UA problem check.py's retry
# already handles. Nothing to fix on our end short of a paid proxy; left
# both in place since the block isn't provably permanent and the retry
# cost when it does happen is small (one extra request + a 2s backoff).
# ESPN's HTTP 202 the same day was different -- a genuinely transient
# "still generating" response from ESPN's own RSS gateway, confirmed by
# the identical URL returning 200 seconds later with nothing else changed.
# Fixed in fetch() itself (202 now retried like 403/406/429), not here.

